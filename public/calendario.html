<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>FocusFlow — Calendario</title>
    <link rel="stylesheet" href="focusflow.css">
    <style>
        .cal-head { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; margin: 6px 0 14px; }
        .cal-head .ff-title { text-align: center; font-size: 28px; margin: 0; }
        .cal-arrow {
            width: 44px; height: 44px; border: 0; background: transparent; color: var(--accent);
            cursor: pointer; display: grid; place-items: center; border-radius: 50%;
        }
        .cal-arrow svg { width: 18px; height: 18px; }

        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 4px; }
        .cal-dow { text-align: center; font-size: 12px; font-weight: 500; color: var(--muted); padding: 6px 0 12px; }
        .cal-day {
            height: 44px; border: 0; background: transparent; border-radius: 12px;
            font: inherit; font-size: 16px; font-weight: 500; color: var(--ink); cursor: pointer;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
        }
        .cal-day[aria-current="date"] { color: var(--accent); font-weight: 700; }
        .cal-day[aria-pressed="true"] { background: rgba(168, 160, 217, 0.18); }
        .dots { display: flex; gap: 3px; height: 5px; }
        .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
        .dots i[data-p="alta"]  { background: var(--coral); }
        .dots i[data-p="media"] { background: var(--gold); }
        .dots i[data-p="bassa"] { background: var(--green); }
        .dots i.done { opacity: 0.35; }

        .back-link {
            display: block; margin: 14px auto 0; background: none; border: 0;
            font: inherit; font-size: 13px; font-weight: 600; color: var(--accent); cursor: pointer;
        }

        .day-panel { margin-top: 26px; }
        .day-title { font-family: var(--font-hand); font-size: 28px; font-weight: 700; margin: 0; }
    </style>
</head>
<body>
    <main class="ff-app">
        <p class="ff-kicker">Calendario</p>

        <div class="cal-head">
            <button class="cal-arrow" type="button" id="prev" aria-label="Mese precedente">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
            </button>
            <h1 class="ff-title" id="month-title"></h1>
            <button class="cal-arrow" type="button" id="next" aria-label="Mese successivo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
            </button>
        </div>

        <div class="cal-grid" id="grid" role="group" aria-labelledby="month-title"></div>
        <button class="back-link" type="button" id="go-today" hidden>Torna a oggi</button>

        <section class="day-panel" id="day-panel" hidden aria-live="polite">
            <h2 class="day-title" id="day-title"></h2>
            <p class="ff-sub" id="day-sub"></p>
            <div id="day-list"></div>
        </section>
    </main>

    <script type="module" src="pages/calendario.js"></script>
</body>
</html>
