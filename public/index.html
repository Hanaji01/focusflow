<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>FocusFlow — Accedi</title>
    <link rel="stylesheet" href="css/focusflow.css">
    <style>
        .login {
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-bottom: 40px;
        }
        .tagline {
            font-family: var(--font-hand);
            font-size: 22px;
            font-weight: 500;
            text-align: center;
            margin: 0 0 20px;
        }
        .tagline span:nth-child(1) { color: var(--ink-rose); }
        .tagline span:nth-child(2) { color: var(--ink-gold); }
        .tagline span:nth-child(3) { color: var(--ink-green); }
        .tagline span:nth-child(4) { color: var(--ink-blue); }
        .tagline span:nth-child(5) { color: var(--ink-lav); }
        .tagline span:nth-child(6) { color: var(--danger); }

        .login-card {
            background: var(--card);
            border-top: 3px solid var(--accent);
            border-radius: 22px;
            padding: 26px 22px 22px;
            box-shadow: 0 2px 4px rgba(60, 50, 40, 0.06), 0 12px 32px rgba(60, 50, 40, 0.10);
        }
        .login-card h1 {
            font-family: var(--font-hand);
            font-size: 34px;
            font-weight: 700;
            text-align: center;
            margin: 0 0 20px;
        }
        .field { display: block; margin-bottom: 14px; }
        .field span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
        .field input {
            width: 100%;
            font: inherit;
            font-size: 15px;
            color: var(--ink);
            background: #F4F1EC;
            border: 2px solid transparent;
            border-radius: 10px;
            padding: 12px;
        }
        .field input:focus { outline: none; border-color: var(--accent); background: #fff; }
        .login-error { min-height: 18px; margin: 0 0 8px; font-size: 12px; color: var(--danger); }
        .switch-mode {
            display: block; margin: 14px auto 0; background: none; border: 0;
            font: inherit; font-size: 13px; color: var(--accent); cursor: pointer;
        }
        .demo-note { margin: 12px 0 0; text-align: center; font-size: 12px; color: var(--muted); }
    </style>
</head>
<body>
    <main class="ff-app login">
        <p class="tagline" aria-label="Every day is a new chance">
            <span>Every</span> <span>day</span> <span>is</span> <span>a</span> <span>new</span> <span>chance</span>
        </p>

        <form class="login-card" id="login-form" novalidate>
            <h1>FocusFlow</h1>

            <label class="field">
                <span>Utente</span>
                <input id="user" type="text" autocomplete="username" autocapitalize="none" required>
            </label>

            <label class="field">
                <span>Password</span>
                <input id="password" type="password" autocomplete="current-password" required>
            </label>

            <p class="login-error" id="login-error" role="alert"></p>
            <button class="btn" type="submit" id="submit-btn">Accedi</button>
            <button class="switch-mode" type="button" id="switch-mode" hidden>Non hai un account? Registrati</button>
        </form>
        <p class="demo-note" id="demo-note" hidden>Modalità demo: nessun server collegato, i dati restano in questo browser.</p>
    </main>

    <script type="module" src="js/pages/login.js"></script>
</body>
</html>
