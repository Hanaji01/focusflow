<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>FocusFlow — Giardino</title>
    <link rel="stylesheet" href="focusflow.css">
    <style>
        /* Sfondo della pagina: sfumatura lilla chiaro → beige, senza quadretti (come nel video) */
        body {
            background-color: #ECEAE5;
            background-image: linear-gradient(#EDF2FB 0%, #ECEFF3 38%, #ECEAE5 80%);
            background-size: auto;
            background-attachment: fixed;
        }

        .stats { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; margin: 22px 0 0; }
        .stat-ico { font-size: 22px; line-height: 1; }
        .stat-num { font-size: 20px; font-weight: 600; line-height: 1.2; margin-top: 6px; }
        .stat-label { font-size: 12px; color: var(--muted); margin-top: 2px; }
        .stat.rose  .stat-num { color: #B58295; }
        .stat.green .stat-num { color: #94AC74; }
        .stat.blue  .stat-num { color: #87A1E1; }

        .meadow { margin: 36px 0 0; }
        .meadow svg { display: block; width: 100%; height: auto; overflow: visible; }
        .garden-note { text-align: center; font-size: 13px; color: var(--muted); margin: 12px 12px 0; }

        .legend {
            margin-top: 26px;
            background: #fff;
            border-radius: 16px;
            padding: 16px 18px 14px;
            box-shadow: 0 1px 2px rgba(60, 50, 40, 0.05), 0 6px 18px rgba(60, 50, 40, 0.05);
        }
        .exit-link {
            display: block; margin: 22px auto 0; background: none; border: 0;
            font: inherit; font-size: 13px; color: var(--muted); cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
        }
        .legend h2 { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0 0 12px; }
        .legend ul {
            list-style: none; margin: 0; padding: 0;
            display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(3, auto);
            grid-auto-flow: column; gap: 10px 26px;
        }
        .legend li { display: flex; align-items: center; gap: 9px; font-size: 14px; }
        .legend li i { width: 14px; height: 14px; border-radius: 50%; background: var(--c); flex: none; }
        .legend li b { margin-left: auto; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
    </style>
</head>
<body>
    <main class="ff-app">
        <p class="ff-kicker">Il tuo</p>
        <h1 class="ff-title">Giardino</h1>

        <div class="stats" aria-label="Riepilogo">
            <div class="stat rose"><div class="stat-ico" aria-hidden="true">🌸</div><div class="stat-num" id="n-flowers">0</div><div class="stat-label">Fiori</div></div>
            <div class="stat green"><div class="stat-ico" aria-hidden="true">✅</div><div class="stat-num" id="n-done">0</div><div class="stat-label">Completati</div></div>
            <div class="stat blue"><div class="stat-ico" aria-hidden="true">📋</div><div class="stat-num" id="n-total">0</div><div class="stat-label">Totali</div></div>
        </div>

        <div class="meadow" id="meadow"></div>
        <p class="garden-note" id="note" hidden>Completa un task per far nascere il primo fiore.</p>

        <section class="legend" aria-labelledby="legend-title">
            <h2 id="legend-title">Legenda petali</h2>
            <ul id="legend"></ul>
        </section>
        <button class="exit-link" type="button" id="logout">Esci dall'account</button>
    </main>

    <script type="module">
        import * as FF from './app.js';

        window.FF = FF;
        await FF.boot('giardino');

        const W = 360;          // larghezza della scena
        const PER_ROW = 9;      // fiori per fascia d'erba
        const ROW_H = 140;      // altezza di una fascia con i suoi fiori
        const STRIP_TOP = 108;  // y della fascia d'erba dentro la riga
        const STRIP_H = 30;
        const CAT_VAR = { lavoro: '--cat-lavoro', casa: '--cat-casa', studio: '--cat-studio', salute: '--cat-salute', personale: '--cat-personale' };

        // Generatore deterministico: lo stesso giorno ha sempre lo stesso stelo
        function hash(str) {
            let h = 2166136261;
            for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
            return (h >>> 0) / 4294967295;
        }

        /* ------------------------------------------------------------
           Disegno del fiore — punto unico da sostituire con la tua grafica.
           (x, y) = base dello stelo; stemH = altezza; tasks = i task completati,
           un petalo per task nel colore della sua categoria (dall'alto, in senso orario).
           ------------------------------------------------------------ */
        function drawFlower(x, y, stemH, tasks) {
            const hy = y - stemH;
            const petals = tasks.map((t, i) => {
                const a = -Math.PI / 2 + (i * 2 * Math.PI) / FF.MAX_TASKS_PER_DAY;
                return `<circle cx="${(x + Math.cos(a) * 8).toFixed(1)}" cy="${(hy + Math.sin(a) * 8).toFixed(1)}" r="4.4" style="fill: var(${CAT_VAR[t.category]})"/>`;
            }).join('');
            return `
              <g>
                <line x1="${x}" y1="${y}" x2="${x}" y2="${hy}" stroke="#90A970" stroke-width="3"/>
                <g fill-opacity="0.92">${petals}</g>
                <circle cx="${x}" cy="${hy}" r="3.6" fill="#F5CFDA"/>
              </g>`;
        }

        function strip(row) {
            const top = row * ROW_H + STRIP_TOP;
            const blades = Array.from({ length: 28 }, (_, i) => {
                const bx = 6 + i * (W - 12) / 27 + (hash('b' + row + i) - 0.5) * 4;
                const bh = 7 + hash('h' + row + i) * 14;
                return `<ellipse cx="${bx.toFixed(1)}" cy="${(top + STRIP_H - bh / 2 - 2).toFixed(1)}" rx="2" ry="${(bh / 2).toFixed(1)}"/>`;
            }).join('');
            return `<rect x="0" y="${top}" width="${W}" height="${STRIP_H}" fill="#D7DDCC"/>
                    <g fill="#ACC095">${blades}</g>`;
        }

        function scene(days) {
            const rows = Math.max(1, Math.ceil(days.length / PER_ROW));
            const H = rows * ROW_H;
            const spacing = (W - 40) / PER_ROW;

            let strips = '';
            let flowers = '';
            for (let r = 0; r < rows; r++) {
                strips += strip(r);
                const group = days.slice(r * PER_ROW, (r + 1) * PER_ROW);
                group.forEach((day, i) => {
                    const x = W / 2 + (i - (group.length - 1) / 2) * spacing;
                    const y = r * ROW_H + STRIP_TOP + 4;
                    flowers += drawFlower(Math.round(x * 10) / 10, y, 34 + hash(day.date) * 44, day.tasks);
                });
            }

            const label = days.length === 0 ? 'Giardino vuoto'
                : `Giardino con ${days.length} ${days.length === 1 ? 'fiore' : 'fiori'}`;
            // le fasce vengono disegnate prima dei fiori: gli steli restano davanti all'erba
            return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${label}">${strips}${flowers}</svg>`;
        }

        function render() {
            const tasks = FF.getTasks();
            const done = tasks.filter((t) => t.done);
            const days = FF.flowers();

            document.getElementById('n-flowers').textContent = days.length;
            document.getElementById('n-done').textContent = done.length;
            document.getElementById('n-total').textContent = tasks.length;
            document.getElementById('meadow').innerHTML = scene(days);
            document.getElementById('note').hidden = days.length > 0;

            // ordine della legenda come nel video
            const ORDER = ['lavoro', 'casa', 'personale', 'salute', 'studio'];
            document.getElementById('legend').innerHTML = ORDER
                .map((key) => [key, FF.CATEGORIES[key]])
                .map(([key, { label }]) => {
                    const n = done.filter((t) => t.category === key).length;
                    return `<li><i style="--c: var(${CAT_VAR[key]})"></i>${label}<b>${n}</b></li>`;
                })
                .join('');
        }

        document.getElementById('logout').addEventListener('click', () => FF.session.logout());
        window.addEventListener('ff:change', render);
        render();
    </script>
</body>
</html>
