<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>FocusFlow — Giardino</title>
    <link rel="stylesheet" href="focusflow.css">
    <style>
        /* Sfondo della pagina: sfumatura lilla chiaro → beige, senza quadretti (come nel video) */
        body {
            background-color: #ECEAE5;
            background-image: linear-gradient(#EDF2FB 0%, #ECEFF3 38%, #ECEAE5 80%);
            background-size: auto;
            background-attachment: fixed;
        }

        .stats { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; margin: 22px 0 0; }
        .stat-num { font-size: 20px; font-weight: 600; line-height: 1.2; }
        .stat-label { font-size: 12px; color: var(--muted); margin-top: 2px; }
        .stat.rose  .stat-num { color: var(--ink-rose); }
        .stat.green .stat-num { color: var(--ink-green); }
        .stat.blue  .stat-num { color: var(--ink-blue); }

        .meadow { margin: 36px 0 0; }
        .meadow svg { display: block; width: 100%; height: auto; overflow: visible; }
        .garden-note { text-align: center; font-size: 13px; color: var(--muted); margin: 12px 12px 0; }

        .account-links { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 18px); right: 18px; display: flex; gap: 14px; }
        .exit-link {
            padding: 4px 0; background: none; border: 0;
            font: inherit; font-size: 13px; color: var(--muted); cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
        }
    </style>
</head>
<body>
    <main class="ff-app">
        <div class="account-links">
            <a class="exit-link" href="account.html">Account</a>
            <button class="exit-link" type="button" id="logout">Esci dall'account</button>
        </div>
        <p class="ff-kicker">Il tuo</p>
        <h1 class="ff-title">Giardino</h1>

        <div class="stats" aria-label="Riepilogo">
            <div class="stat rose"><div class="stat-num" id="n-flowers">0</div><div class="stat-label">Fiori</div></div>
            <div class="stat green"><div class="stat-num" id="n-done">0</div><div class="stat-label">Completati</div></div>
            <div class="stat blue"><div class="stat-num" id="n-total">0</div><div class="stat-label">Totali</div></div>
        </div>

        <div class="meadow" id="meadow"></div>
        <p class="garden-note" id="note" hidden>Completa un task per far nascere il primo fiore.</p>

    </main>

    <script type="module" src="pages/giardino.js"></script>
</body>
</html>
