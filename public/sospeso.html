<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>FocusFlow — In sospeso</title>
    <link rel="stylesheet" href="focusflow.css">
    <style>
        .ff-section.group { display: flex; align-items: center; gap: 8px; color: var(--p, var(--muted)); }
        .ff-section.group::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--p, var(--muted)); }
        .group[data-p="alta"]  { --p: var(--coral); }
        .group[data-p="media"] { --p: var(--gold); }
        .group[data-p="bassa"] { --p: var(--green); }

        .task-side { flex: none; }
        .link-btn {
            background: none; border: 0; padding: 2px 0;
            font: inherit; font-size: 12px; font-weight: 600;
            color: var(--accent); cursor: pointer; white-space: nowrap;
        }
        .task-actions { display: flex; gap: 14px; margin-top: 8px; }
        .task-actions button {
            background: none; border: 0; padding: 0;
            font: inherit; font-size: 11px; color: var(--muted);
            cursor: pointer; text-decoration: underline; text-underline-offset: 2px;
        }
        .task-actions .danger:hover { color: var(--coral); }

        /* Campo data nascosto, aperto dal pulsante "Altro giorno" */
        .vh { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    </style>
</head>
<body>
    <main class="ff-app">
        <p class="ff-kicker">In sospeso</p>
        <h1 class="ff-title">Da fare</h1>
        <p class="ff-sub" id="count"></p>

        <div id="list"></div>
        <input class="vh" type="date" id="picker" tabindex="-1" aria-hidden="true">
    </main>

    <script type="module">
        import * as FF from './app.js';

        window.FF = FF;
        await FF.boot('sospeso');

        const today = FF.todayISO();
        const listEl = document.getElementById('list');
        const picker = document.getElementById('picker');
        picker.min = today;
        let movingId = null;

        const GROUPS = [['alta', 'Priorità alta'], ['media', 'Priorità media'], ['bassa', 'Priorità bassa']];

        function card(t) {
            return `
              <article class="task" data-cat="${t.category}" data-id="${t.id}">
                <button class="task-check" type="button" data-check="${t.id}" aria-label="Segna come completato">${FF.ICONS.check}</button>
                <div class="task-body">
                  <div class="task-title">${FF.esc(t.title)}</div>
                  <div class="task-meta">
                    <span class="cat-label">${FF.CATEGORIES[t.category].label}</span>
                    <span>Scaduto: ${FF.shortDate(t.date)}</span>
                  </div>
                  <div class="task-actions">
                    <button type="button" data-other="${t.id}">Altro giorno</button>
                    <button type="button" class="danger" data-delete="${t.id}">Elimina</button>
                  </div>
                </div>
                <div class="task-side"><button class="link-btn" type="button" data-today="${t.id}">Oggi →</button></div>
              </article>`;
        }

        function render() {
            const tasks = FF.overdue(today).sort((a, b) => a.date.localeCompare(b.date));
            document.getElementById('count').textContent =
                tasks.length === 1 ? '1 task in attesa' : `${tasks.length} task in attesa`;

            if (tasks.length === 0) {
                listEl.innerHTML = `<div class="ff-empty"><strong>Niente in sospeso</strong>I task non completati dei giorni passati compariranno qui.</div>`;
                return;
            }
            listEl.innerHTML = GROUPS
                .map(([p, label]) => {
                    const items = tasks.filter((t) => t.priority === p);
                    return items.length
                        ? `<h2 class="ff-section group" data-p="${p}">${label}</h2>${items.map(card).join('')}`
                        : '';
                })
                .join('');
        }

        listEl.addEventListener('click', (e) => {
            const btn = e.target.closest('button');
            if (!btn) return;
            const { check, today: toToday, other, delete: del } = btn.dataset;
            if (check) FF.toggleTask(check);
            else if (toToday) FF.moveTask(toToday, today);
            else if (other) {
                movingId = other;
                picker.value = '';
                if (picker.showPicker) picker.showPicker(); else picker.click();
            } else if (del) {
                const task = FF.getTasks().find((t) => t.id === del);
                if (task && confirm(`Eliminare "${task.title}"?`)) FF.removeTask(del);
            }
        });

        picker.addEventListener('change', () => {
            if (movingId && picker.value) FF.moveTask(movingId, picker.value);
            movingId = null;
        });

        window.addEventListener('ff:change', render);
        render();
    </script>
</body>
</html>
