<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>FocusFlow — In sospeso</title>
    <link rel="stylesheet" href="focusflow.css">
    <style>
        .ff-section.group { display: flex; align-items: center; gap: 8px; color: var(--muted); }
        .ff-section.group::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--p, var(--muted)); }
        .group[data-p="alta"]  { --p: var(--coral); }
        .group[data-p="media"] { --p: var(--gold); }
        .group[data-p="bassa"] { --p: var(--green); }

        .task-side { flex: none; }
        .link-btn {
            background: none; border: 0; padding: 2px 0;
            font: inherit; font-size: 12px; font-weight: 600;
            color: var(--accent); cursor: pointer; white-space: nowrap;
        }
        .task-actions { display: flex; gap: 14px; margin-top: 8px; }
        .task-actions button {
            background: none; border: 0; padding: 0;
            font: inherit; font-size: 12px; color: var(--muted);
            cursor: pointer; text-decoration: underline; text-underline-offset: 2px;
        }
        .task-actions .danger:hover { color: var(--danger); }

        /* Campo data nascosto, aperto dal pulsante "Altro giorno" */
        .vh { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    </style>
</head>
<body>
    <main class="ff-app">
        <p class="ff-kicker">In sospeso</p>
        <h1 class="ff-title">Da fare</h1>
        <p class="ff-sub" id="count"></p>

        <div id="list"></div>
        <input class="vh" type="date" id="picker" tabindex="-1" aria-hidden="true">
    </main>

    <script type="module" src="pages/sospeso.js"></script>
</body>
</html>
